{% extends 'base.html' %}

{% block title %}Login | LIFE RPG{% endblock %}

{% block content %}

<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass-panel" style="padding: 3rem; width: 100%; max-width: 400px;">


    <h2 class="text-gradient" style="text-align: center; margin-bottom: 2rem;">
        LOGIN
    </h2>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        {% if messages %}
            <div style="margin-bottom: 1rem; color: var(--error);">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
        </div>

        <button
            type="submit"
            class="btn btn-primary"
            style="width: 100%; margin-top: 1rem;"
        >
            ENTER THE REALM
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account?
        <a href="{% url 'register' %}">Sign up</a>
    </div>

</div>


</div>
{% endblock %}
